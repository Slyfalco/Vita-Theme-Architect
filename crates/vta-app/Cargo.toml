[package]
name = "vta-app"
description = "VitaTheme Architect"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "vitaThemeArchitect"
path = "src/main.rs"

[dependencies]
vta-core = { path = "../vta-core" }
vta-online = { path = "../vta-online" }
slint = { version = "1.19", features = ["unstable-winit-030", "raw-window-handle-06"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
at9codec = { git = "https://github.com/Slyfalco/at9codec", tag = "v2" }
cpal = "0.18"
rfd = "0.18"
arboard = { version = "3", default-features = false }
wry = "0.57"
base64 = "0.23"
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.19"
winresource = "0.1"

[features]
# The AI icon generator edition (v2 builds it by default; --no-default-features = Standard).
default = ["icon-ai"]
icon-ai = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
