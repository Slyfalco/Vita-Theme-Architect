[package]
name = "vta-app"
description = "VitaTheme Architect"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "VitaThemeArchitect"
path = "src/main.rs"

[dependencies]
vta-core = { path = "../vta-core" }
slint = { version = "1.19", features = ["unstable-winit-030"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
at9codec = { git = "https://github.com/Slyfalco/at9codec", tag = "v1" }
cpal = "0.18"
rfd = "0.18"
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1.19"

[features]
# The AI icon generator edition (v2 builds it by default; --no-default-features = Standard).
default = ["icon-ai"]
icon-ai = []
