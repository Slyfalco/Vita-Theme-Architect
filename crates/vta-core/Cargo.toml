[package]
name = "vta-core"
description = "Theme model, theme.xml reader/writer and library logic for VitaTheme Architect"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
roxmltree = "0.20"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
suppaftp = { version = "13", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "3"
regex = "1"
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
