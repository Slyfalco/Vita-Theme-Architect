[package]
name = "vta-core"
description = "Theme model, theme.xml reader/writer and library logic for VitaTheme Architect"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
roxmltree = "0.20"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
suppaftp = { version = "13", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "3"
regex = "1"
flate2 = "1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
png = "0.18"
color_quant = "2"
symphonia = { version = "0.6", features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff"] }
base64 = "0.22"
sha1 = "0.10"
htmlize = { version = "1", features = ["unescape"] }
vta-online = { path = "../vta-online" }
at9codec = { git = "https://github.com/Slyfalco/at9codec", tag = "v2" }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
pbkdf2 = "0.12"
getrandom = "0.2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
