[workspace]
resolver = "2"
members = ["crates/vta-core", "crates/vta-online", "crates/vta-app", "crates/xtask"]

[workspace.package]
version = "3.0.0"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/Slyfalco/Vita-Theme-Architect"
authors = ["Slyfalco"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Fast local testing: release-level speed, but debug assertions stay on so the
# dev-only paths (the .dev theme-list access, VTA_DEV_* hooks) still work. Not
# used for packaging. Run: cargo run -p vta-app --profile devfast
[profile.devfast]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16
incremental = true
strip = false
