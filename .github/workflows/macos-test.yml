# TEMP / debug workflow: iterate the macOS build (x64 + arm64) and smoke test WITHOUT
# re-running the whole release matrix, and WITHOUT the release secret.
#
# It does a NON-release build (no VTA_RELEASE_SCRIPT / VTA_RELEASE_B64), so no secret key
# material is generated and the full build output is safe to show in the (public) log —
# which makes it usable for debugging. It does NOT upload anything to a release.
#
# Use it to confirm: (1) macos-x64 produces a real x86_64 build labelled `macos-x64`
# (not a mislabeled arm64 one), and (2) the smoke launch works on both arches. Once this
# is green, the real builds come from release-build.yml. Delete this file when done.

name: macOS build test (temp, non-release)

on:
  workflow_dispatch:

concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.tag }}
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: macos-x64,   pyarch: x64 }
          - { tag: macos-arm64, pyarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Set up Python 3.12 (${{ matrix.pyarch }})
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.pyarch }}

      - name: Use a real x86_64 Python (macos-x64)
        if: matrix.tag == 'macos-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo astral-sh/python-build-standalone \
            --pattern 'cpython-3.12.*-x86_64-apple-darwin-install_only.tar.gz' \
            --dir pydl --clobber
          tar -xzf pydl/cpython-3.12.*-x86_64-apple-darwin-install_only.tar.gz   # -> ./python/
          ln -sf python3 python/bin/python
          echo "$PWD/python/bin" >> "$GITHUB_PATH"
          ./python/bin/python3 -c "import platform; print('build python arch:', platform.machine())"

      - name: Normalise requirements.txt to UTF-8
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("requirements.txt")
          p.write_text(p.read_text(encoding="utf-16"), encoding="utf-8")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify native AT9 codec is committed
        shell: bash
        run: |
          LIB="native/${{ matrix.tag }}/libat9codec.dylib"
          [ -f "$LIB" ] || { echo "::error::$LIB missing"; exit 1; }
          echo "found $LIB"

      - name: Build (NON-release, ai edition) — output visible (no secret)
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          VTA_NUITKA_PROGRESS: "1"
          VTA_SKIP_PIP: "1"
          VTA_NONINTERACTIVE: "1"
        run: python -u setup_build.py

      - name: Verify the package is labelled for this arch
        shell: bash
        run: |
          PKG=$(ls dist/vitaThemeArchitect-${{ matrix.tag }}-ai.zip 2>/dev/null | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::expected dist/vitaThemeArchitect-${{ matrix.tag }}-ai.zip not found — wrong arch label?"
            ls -la dist || true
            exit 1
          fi
          echo "OK: $PKG"

      - name: Smoke launch (CFBundleExecutable, offscreen)
        continue-on-error: true
        run: |
          APP=$(find dist -maxdepth 3 -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "no .app found"; exit 0; }
          EXENAME=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist" 2>/dev/null)
          EXE="$APP/Contents/MacOS/$EXENAME"
          [ -x "$EXE" ] && [ -f "$EXE" ] || { echo "bundle executable not found ($EXE)"; exit 0; }
          echo "launching: $EXENAME (offscreen, 25s)"
          QT_QPA_PLATFORM=offscreen "$EXE" >smoke.log 2>&1 &
          PID=$!; sleep 25
          if kill -0 "$PID" 2>/dev/null; then echo "smoke OK: still running after 25s"; kill "$PID" 2>/dev/null || true
          else wait "$PID"; RC=$?; echo "app exited early rc=$RC"; tail -40 smoke.log || true; fi
