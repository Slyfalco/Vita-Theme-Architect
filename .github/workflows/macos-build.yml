# macOS release builds (Intel + Apple Silicon), produced in CI because the only
# physical dev machine is Windows. Manual trigger only (workflow_dispatch): this
# job has access to a build secret, so it must never run from an untrusted
# pull_request. Third-party actions are pinned by commit SHA for the same reason.
#
# Output: one build artifact per edition/arch, named
#   vitaThemeArchitect-macos-<arch>-<edition>.zip
# Download with `gh run download <run-id>` and upload to the GitHub release.
#
# One-time setup before the first run (see repo maintainer notes):
#   the release build script is provided as the encrypted Actions secret
#   VTA_RELEASE_B64 (gzip + base64). Without it, this workflow fails fast rather
#   than silently producing a non-release build.

name: macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]      # macos-13 = Intel x64, macos-14 = Apple Silicon arm64
        edition: [ai, standard]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Normalise requirements.txt to UTF-8
        # requirements.txt is stored UTF-16 in-repo; pip can't read that.
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("requirements.txt")
          p.write_text(p.read_text(encoding="utf-16"), encoding="utf-8")
          print("requirements.txt converted to UTF-8")
          PY

      - name: Prepare release build inputs
        env:
          REL: ${{ secrets.VTA_RELEASE_B64 }}
        run: |
          if [ -z "${REL:-}" ]; then
            echo "::error::Secret VTA_RELEASE_B64 is not set; cannot produce a release build."
            exit 1
          fi
          python - <<'PY'
          import os, base64, gzip, pathlib
          data = gzip.decompress(base64.b64decode(os.environ["REL"]))
          pathlib.Path("_relbuild.py").write_bytes(data)
          print("release build script staged")
          PY
          echo "VTA_RELEASE_SCRIPT=_relbuild.py" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build (${{ matrix.edition }})
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          VTA_NUITKA_PROGRESS: "1"
          VTA_SKIP_PIP: "1"            # deps installed above
        run: |
          FLAG=""
          if [ "${{ matrix.edition }}" = "standard" ]; then FLAG="--no-icon-ai"; fi
          python -u setup_build.py $FLAG

      - name: Clean up staged inputs
        if: always()
        run: rm -f _relbuild.py

      - name: Verify package
        id: pkg
        run: |
          ZIP=$(ls dist/vitaThemeArchitect-macos-*-${{ matrix.edition }}.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ] || [ ! -s "$ZIP" ]; then
            echo "::error::Expected packaged .zip not found for edition ${{ matrix.edition }}."
            ls -la dist || true
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Packaged: $ZIP ($(du -h "$ZIP" | cut -f1))"

      - name: Headless smoke launch (best effort, non-gating)
        continue-on-error: true
        run: |
          APP=$(find dist -maxdepth 3 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "no .app found; skipping smoke"; exit 0; fi
          EXE=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -1)
          if [ -z "$EXE" ]; then echo "no executable in .app; skipping smoke"; exit 0; fi
          echo "launching: $EXE (offscreen, 25s)"
          QT_QPA_PLATFORM=offscreen "$EXE" >/tmp/smoke.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 "$PID" 2>/dev/null; then
            echo "smoke OK: still running after 25s"
            kill "$PID" 2>/dev/null || true
          else
            wait "$PID"; RC=$?
            echo "app exited early rc=$RC"; tail -40 /tmp/smoke.log || true
            [ "$RC" -eq 0 ] || echo "::warning::smoke launch exited non-zero (needs a real Mac to confirm)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: vitaThemeArchitect-macos-${{ matrix.os }}-${{ matrix.edition }}
          path: dist/vitaThemeArchitect-macos-*-${{ matrix.edition }}.zip
          if-no-files-found: error
          retention-days: 14
