# Full release build matrix for every platform the app can target: Windows, Linux
# and macOS, each x64 + arm64, both editions (ai + standard). One workflow, like the
# at9codec lib build — run it and it produces/uploads everything CI can build; make
# anything it skips locally with build-all.ps1 (and the Windows installers, which are
# built locally only).
#
# Manual trigger only (workflow_dispatch): the build uses the release secret, so it
# must never run from an untrusted pull_request. Third-party actions pinned by SHA.
#
# Jobs are continue-on-error: a flaky/unavailable runner (GitHub's ARM images come and
# go) is SKIPPED instead of failing the run, and every job uploads its own package
# straight to the release, so one platform skipping never blocks the others. macOS is
# the platform you cannot build locally, so CI is the primary source for it.
#
# Output per job: vitaThemeArchitect-<os>-<arch>-<edition>.{zip|tar.gz}
#
# Needs the release build script as the encrypted Actions secret VTA_RELEASE_B64
# (gzip + base64), and the native at9codec libs committed under native/<os>-<arch>/.

name: Release build (all platforms)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the builds to (e.g. v2.0)"
        default: "v2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.tag }} ${{ matrix.edition }}
    runs-on: ${{ matrix.os }}
    # Non-blocking: a flaky/unavailable runner skips instead of failing the run.
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { os: windows-latest,   tag: windows-x64,   pyarch: x64,   edition: ai }
          - { os: windows-latest,   tag: windows-x64,   pyarch: x64,   edition: standard }
          - { os: windows-11-arm,   tag: windows-arm64, pyarch: arm64, edition: ai }
          - { os: windows-11-arm,   tag: windows-arm64, pyarch: arm64, edition: standard }
          # Linux
          - { os: ubuntu-latest,    tag: linux-x64,     pyarch: x64,   edition: ai }
          - { os: ubuntu-latest,    tag: linux-x64,     pyarch: x64,   edition: standard }
          - { os: ubuntu-24.04-arm, tag: linux-arm64,   pyarch: arm64, edition: ai }
          - { os: ubuntu-24.04-arm, tag: linux-arm64,   pyarch: arm64, edition: standard }
          # macOS — both on macos-15 (the only reliably-provisioned image); x64 runs an
          # x86_64 Python under Rosetta, arm64 is native.
          - { os: macos-15,         tag: macos-x64,     pyarch: x64,   edition: ai }
          - { os: macos-15,         tag: macos-x64,     pyarch: x64,   edition: standard }
          - { os: macos-15,         tag: macos-arm64,   pyarch: arm64, edition: ai }
          - { os: macos-15,         tag: macos-arm64,   pyarch: arm64, edition: standard }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rosetta 2 (macOS)
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Set up Python 3.12 (${{ matrix.pyarch }})
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.pyarch }}

      - name: Linux build + runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential patchelf ccache python3-dev \
            libvlc-dev vlc-plugin-base ffmpeg libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-randr0 libxcb-shape0 libxcb-xkb1 libxcb-util1

      - name: Normalise requirements.txt to UTF-8
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("requirements.txt")
          p.write_text(p.read_text(encoding="utf-16"), encoding="utf-8")
          print("requirements.txt converted to UTF-8")
          PY

      - name: Prepare release build inputs
        shell: bash
        env:
          REL: ${{ secrets.VTA_RELEASE_B64 }}
        run: |
          if [ -z "${REL:-}" ]; then
            echo "::error::Secret VTA_RELEASE_B64 is not set; cannot produce a release build."
            exit 1
          fi
          python - <<'PY'
          import os, base64, gzip, pathlib
          data = gzip.decompress(base64.b64decode(os.environ["REL"]))
          pathlib.Path("_relbuild.py").write_bytes(data)
          print("release build script staged")
          PY
          echo "VTA_RELEASE_SCRIPT=_relbuild.py" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify native AT9 codec is committed
        shell: bash
        run: |
          case "${{ matrix.tag }}" in
            windows-*) LIB="native/${{ matrix.tag }}/at9codec.dll" ;;
            linux-*)   LIB="native/${{ matrix.tag }}/libat9codec.so" ;;
            macos-*)   LIB="native/${{ matrix.tag }}/libat9codec.dylib" ;;
          esac
          if [ ! -f "$LIB" ]; then
            echo "::error::$LIB is missing. Run 'python scripts/update_native_libs.py' and commit native/ first."
            exit 1
          fi
          echo "found $LIB"

      - name: Build (${{ matrix.edition }})
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          VTA_NUITKA_PROGRESS: "1"
          VTA_SKIP_PIP: "1"            # deps installed above
          VTA_NONINTERACTIVE: "1"      # no tty: skip the sudo credential prompt (Linux)
        run: |
          FLAG=""
          if [ "${{ matrix.edition }}" = "standard" ]; then FLAG="--no-icon-ai"; fi
          python -u setup_build.py $FLAG

      - name: Clean up staged inputs
        if: always()
        shell: bash
        run: rm -f _relbuild.py

      - name: Verify package
        id: pkg
        shell: bash
        run: |
          case "${{ matrix.tag }}" in
            linux-*) EXT="tar.gz" ;;
            *)       EXT="zip" ;;
          esac
          PKG=$(ls dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.$EXT 2>/dev/null | head -1)
          if [ -z "$PKG" ] || [ ! -s "$PKG" ]; then
            echo "::error::Expected package not found for ${{ matrix.tag }} ${{ matrix.edition }}."
            ls -la dist || true
            exit 1
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "Packaged: $PKG"

      - name: Headless smoke launch (macOS, best effort, non-gating)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          APP=$(find dist -maxdepth 3 -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "no .app found; skipping smoke"; exit 0; }
          EXE=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -1)
          [ -z "$EXE" ] && { echo "no executable in .app; skipping smoke"; exit 0; }
          echo "launching: $EXE (offscreen, 25s)"
          QT_QPA_PLATFORM=offscreen "$EXE" >/tmp/smoke.log 2>&1 &
          PID=$!; sleep 25
          if kill -0 "$PID" 2>/dev/null; then echo "smoke OK"; kill "$PID" 2>/dev/null || true
          else wait "$PID"; RC=$?; echo "exited rc=$RC"; tail -40 /tmp/smoke.log || true; fi

      - name: Upload to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
          PKG: ${{ steps.pkg.outputs.pkg }}
        run: |
          TAG="${TAG:-v2.0}"
          echo "Uploading $PKG to release $TAG"
          gh release upload "$TAG" "$PKG" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload artifact (backup copy)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}
          path: dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.*
          if-no-files-found: error
          retention-days: 14

  # Windows installers (offline both-editions + online stub), compiled with Inno
  # Setup after the portable builds exist. The off-git installer/ tooling is staged
  # from the VTA_INSTALLER_B64 secret (tooling only; the wizard images are
  # regenerated, and both-edition payloads are the release's own portable zips).
  # continue-on-error: windows-11-arm is flaky — build the arm installer locally if
  # it skips. Installers are Windows-only.
  installers:
    name: installers ${{ matrix.tag }}
    needs: build
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, tag: windows-x64 }
          - { os: windows-11-arm, tag: windows-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Unpack installer tooling (off-git, from secret)
        shell: bash
        env:
          INST: ${{ secrets.VTA_INSTALLER_B64 }}
        run: |
          if [ -z "${INST:-}" ]; then
            echo "::error::Secret VTA_INSTALLER_B64 is not set; cannot build installers."
            exit 1
          fi
          echo "$INST" | base64 -d > installer.tgz
          tar -xzf installer.tgz
          rm -f installer.tgz
          ls installer

      - name: Regenerate wizard images
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python installer/assets/make_wizard_images.py

      - name: Install Inno Setup
        shell: bash
        run: choco install innosetup -y --no-progress

      - name: Download edition payloads from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${TAG:-v2.0}"
          mkdir -p _payload_dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "vitaThemeArchitect-${{ matrix.tag }}-ai.zip" \
            --pattern "vitaThemeArchitect-${{ matrix.tag }}-standard.zip" \
            --dir _payload_dl --clobber

      - name: Stage both-edition payloads
        shell: bash
        run: |
          for ed in ai standard; do
            zip="_payload_dl/vitaThemeArchitect-${{ matrix.tag }}-$ed.zip"
            [ -f "$zip" ] || { echo "::error::missing payload $zip (its build job must have skipped)"; exit 1; }
            mkdir -p "installer/payload/$ed" "_unz_$ed"
            unzip -q "$zip" -d "_unz_$ed"
            cp -r _unz_$ed/vitaThemeArchitect-*/* "installer/payload/$ed/"
          done
          ls installer/payload

      - name: Build installers (reuse staged payloads)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/build-installers.ps1 -SkipBuild

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${TAG:-v2.0}"
          found=0
          for f in "dist/vitaThemeArchitect-${{ matrix.tag }}-setup.exe" \
                   "dist/vitaThemeArchitect-${{ matrix.tag }}-online-setup.exe"; do
            if [ -f "$f" ]; then echo "upload $f"; gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"; found=1; fi
          done
          [ "$found" = "1" ] || { echo "::error::no installer .exe produced"; ls -la dist || true; exit 1; }
