# Full release build matrix for every platform the app can target: Windows, Linux
# and macOS, each x64 + arm64, both editions (ai + standard). One workflow — run it
# and it produces/uploads everything CI can build; make anything it skips locally
# with build-all.ps1 (and the Windows installers, which are built locally only).
#
# v3 is Rust (cargo + the `xtask` packager). No Python/Nuitka; at9codec is a cargo
# git dependency, so there are no committed native libs to verify. The release's
# online features come from the off-git `native-release/` protection crate (the
# equivalent of the v2 secure modules): it is staged from the encrypted Actions
# secret VTA_RELEASE_B64 (gzip + base64 of a tar of `native-release/` and
# `.dev/theme_api_url`), and `xtask` runs its hook via VTA_RELEASE_SCRIPT.
#
# For a mac-only fill/fix (when a full run only failed on macOS), use macos-release.yml
# instead so you don't rebuild Windows/Linux — it produces the same macos zips plus the
# drag-to-Applications .dmgs.
#
# Manual trigger only (workflow_dispatch): the build uses the release secret, so it
# must never run from an untrusted pull_request. Third-party actions pinned by SHA.
#
# Jobs are continue-on-error: a flaky/unavailable runner (GitHub's ARM images come and
# go) is SKIPPED instead of failing the run, and every job uploads its own package
# straight to the release, so one platform skipping never blocks the others. macOS is
# the platform you cannot build locally, so CI is the primary source for it.
#
# Output per job: dist/v3/vitaThemeArchitect-<os>-<arch>-<edition>.{zip|tar.gz}

name: Release build (all platforms)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the builds to (e.g. v3.0)"
        default: "v3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.tag }} ${{ matrix.edition }}
    runs-on: ${{ matrix.os }}
    # Non-blocking: a flaky/unavailable runner skips instead of failing the run.
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (cargo builds natively per-arch).
          - { os: windows-latest,   tag: windows-x64,   edition: ai }
          - { os: windows-latest,   tag: windows-x64,   edition: standard }
          - { os: windows-11-arm,   tag: windows-arm64, edition: ai }
          - { os: windows-11-arm,   tag: windows-arm64, edition: standard }
          # Linux.
          - { os: ubuntu-latest,    tag: linux-x64,     edition: ai }
          - { os: ubuntu-latest,    tag: linux-x64,     edition: standard }
          - { os: ubuntu-24.04-arm, tag: linux-arm64,   edition: ai }
          - { os: ubuntu-24.04-arm, tag: linux-arm64,   edition: standard }
          # macOS — both on macos-15; arm64 is native, x64 cross-compiles to
          # x86_64-apple-darwin (Rust cross-targets cleanly; xtask tags it via
          # VTA_TAG_OVERRIDE/VTA_BUILD_TARGET).
          - { os: macos-15,         tag: macos-x64,     edition: ai,       target: x86_64-apple-darwin }
          - { os: macos-15,         tag: macos-x64,     edition: standard, target: x86_64-apple-darwin }
          - { os: macos-15,         tag: macos-arm64,   edition: ai }
          - { os: macos-15,         tag: macos-arm64,   edition: standard }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up the Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi
          rustc --version

      - name: Cache cargo
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a  # v4.1.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.tag }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.tag }}-

      - name: Linux build dependencies (Slint, rfd/GTK, wry/webkit, cpal/ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev libxcb1-dev \
            libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev \
            libasound2-dev

      - name: Stage the off-git release protection crate (from secret)
        shell: bash
        env:
          REL: ${{ secrets.VTA_RELEASE_B64 }}
        run: |
          if [ -z "${REL:-}" ]; then
            echo "::error::Secret VTA_RELEASE_B64 is not set; cannot produce a release build."
            exit 1
          fi
          # The secret is gzip+base64 of a tar containing `native-release/` and
          # `.dev/theme_api_url`. Decode quietly (never echo its contents).
          echo "$REL" | base64 -d | tar -xz
          test -f native-release/build_online_module.py || { echo "::error::release bundle missing the hook"; exit 1; }
          echo "VTA_RELEASE_SCRIPT=native-release/build_online_module.py" >> "$GITHUB_ENV"

      - name: Build + package (${{ matrix.edition }})
        shell: bash
        env:
          VTA_TAG_OVERRIDE: ${{ matrix.tag }}
          VTA_BUILD_TARGET: ${{ matrix.target }}
        run: |
          # PUBLIC-REPO SAFETY: the release step runs the protection hook, which
          # builds the module bound to the exe (its build.rs reads the API key).
          # Keep the whole build's output out of the public log; on failure print
          # only a generic message and delete the captured log.
          set +e
          cargo run -p xtask --release -- package --edition ${{ matrix.edition }} > build_output.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::release build failed (exit $rc). Output withheld (may contain secrets); reproduce locally to debug."
            rm -f build_output.log
            exit "$rc"
          fi
          rm -f build_output.log
          echo "release build succeeded (output withheld for public-log safety)."

      - name: Clean up the staged release crate
        if: always()
        shell: bash
        run: rm -rf native-release .dev

      - name: Verify package
        id: pkg
        shell: bash
        run: |
          case "${{ matrix.tag }}" in
            linux-*) EXT="tar.gz" ;;
            *)       EXT="zip" ;;
          esac
          PKG=$(ls dist/v3/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.$EXT 2>/dev/null | head -1)
          if [ -z "$PKG" ] || [ ! -s "$PKG" ]; then
            echo "::error::Expected package not found for ${{ matrix.tag }} ${{ matrix.edition }}."
            ls -la dist/v3 || true
            exit 1
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "Packaged: $PKG"

      - name: Headless smoke launch (Linux, best effort, non-gating)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb
          DIR=$(ls -d dist/v3/vitaThemeArchitect-${{ matrix.tag }} 2>/dev/null | head -1)
          EXE="$DIR/vitaThemeArchitect"
          [ -x "$EXE" ] || { echo "no exe found; skipping smoke"; exit 0; }
          # Under a virtual X server; the app is expected to open its window and keep
          # running. Its output is withheld from the public log.
          xvfb-run -a timeout 25 "$EXE" >smoke.log 2>&1 &
          PID=$!; sleep 22
          if kill -0 "$PID" 2>/dev/null; then echo "smoke OK: still running"; kill "$PID" 2>/dev/null || true
          else wait "$PID"; RC=$?; echo "app exited early rc=$RC (output withheld)"; fi
          rm -f smoke.log

      - name: Upload to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
          PKG: ${{ steps.pkg.outputs.pkg }}
        run: |
          TAG="${TAG:-v3.0}"
          echo "Uploading $PKG to release $TAG"
          gh release upload "$TAG" "$PKG" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload artifact (backup copy)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}
          path: dist/v3/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.*
          if-no-files-found: error
          retention-days: 14

  # Windows installers (offline both-editions + online stub), compiled with Inno
  # Setup after the portable builds exist. The off-git installer/ tooling is staged
  # from the VTA_INSTALLER_B64 secret (tooling only; the wizard images are
  # regenerated, and both-edition payloads are the release's own portable zips).
  # continue-on-error: windows-11-arm is flaky — build the arm installer locally if
  # it skips. Installers are Windows-only.
  installers:
    name: installers ${{ matrix.tag }}
    needs: build
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, tag: windows-x64 }
          - { os: windows-11-arm, tag: windows-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Unpack installer tooling (off-git, from secret)
        shell: bash
        env:
          INST: ${{ secrets.VTA_INSTALLER_B64 }}
        run: |
          if [ -z "${INST:-}" ]; then
            echo "::error::Secret VTA_INSTALLER_B64 is not set; cannot build installers."
            exit 1
          fi
          echo "$INST" | base64 -d > installer.tgz
          tar -xzf installer.tgz
          rm -f installer.tgz
          ls installer

      - name: Regenerate wizard images
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python installer/assets/make_wizard_images.py

      - name: Install Inno Setup
        shell: bash
        run: choco install innosetup -y --no-progress

      - name: Download edition payloads from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${TAG:-v3.0}"
          mkdir -p _payload_dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "vitaThemeArchitect-${{ matrix.tag }}-ai.zip" \
            --pattern "vitaThemeArchitect-${{ matrix.tag }}-standard.zip" \
            --dir _payload_dl --clobber

      - name: Stage both-edition payloads
        shell: bash
        run: |
          for ed in ai standard; do
            zip="_payload_dl/vitaThemeArchitect-${{ matrix.tag }}-$ed.zip"
            [ -f "$zip" ] || { echo "::error::missing payload $zip (its build job must have skipped)"; exit 1; }
            mkdir -p "installer/payload/$ed" "_unz_$ed"
            unzip -q "$zip" -d "_unz_$ed"
            cp -r _unz_$ed/vitaThemeArchitect-*/* "installer/payload/$ed/"
          done
          ls installer/payload

      - name: Build installers (reuse staged payloads)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/build-installers.ps1 -SkipBuild

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${TAG:-v3.0}"
          found=0
          for f in "dist/vitaThemeArchitect-${{ matrix.tag }}-setup.exe" \
                   "dist/vitaThemeArchitect-${{ matrix.tag }}-online-setup.exe"; do
            if [ -f "$f" ]; then echo "upload $f"; gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"; found=1; fi
          done
          [ "$found" = "1" ] || { echo "::error::no installer .exe produced"; ls -la dist || true; exit 1; }

  # macOS drag-to-Applications .dmg installers. Just repackages the already-built .app
  # from the release's portable zip (hdiutil + an Applications symlink) — no release
  # secret, nothing sensitive, so it runs visibly. One .dmg per arch × edition.
  mac-installers:
    name: dmg ${{ matrix.tag }} ${{ matrix.edition }}
    needs: build
    if: ${{ always() }}
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: macos-x64,   edition: ai }
          - { tag: macos-x64,   edition: standard }
          - { tag: macos-arm64, edition: ai }
          - { tag: macos-arm64, edition: standard }
    steps:
      - name: Download the portable .app zip from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${TAG:-v3.0}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.zip" \
            --dir _dl --clobber

      - name: Build the drag-to-Applications .dmg
        shell: bash
        run: |
          unzip -q "_dl/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.zip" -d _unz
          APP=$(find _unz -maxdepth 2 -name "*.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::no .app found in the portable zip"; exit 1; }
          staging=$(mktemp -d)
          cp -R "$APP" "$staging/"
          ln -s /Applications "$staging/Applications"
          out="vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.dmg"
          hdiutil create -volname "VitaTheme Architect" -srcfolder "$staging" -ov -format UDZO "$out"
          echo "built $out"

      - name: Upload the .dmg to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${TAG:-v3.0}"
          gh release upload "$TAG" "vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.dmg" --clobber --repo "$GITHUB_REPOSITORY"
