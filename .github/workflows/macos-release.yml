# macOS release build — the mac half of a release, on its own so you can (re)build
# just macOS (zip + drag-to-Applications .dmg) without re-running the Windows/Linux
# matrix. macOS is the one platform you can't build locally, so this is its home.
#
# Dispatch only (uses the release secret, so never a pull_request). Default is a REAL
# release build (online features): its output is captured and NEVER printed, because
# the release build generates secret key material and this is a public repo. Set
# `debug: true` for a non-release build with visible output (no secret, no upload) to
# debug the toolchain/smoke safely.
#
# Produces per arch × edition: vitaThemeArchitect-macos-<arch>-<edition>.{zip,dmg}.

name: macOS release (zip + dmg)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload to"
        default: "v2.0"
        required: true
      debug:
        description: "Non-release build, visible output, no upload (toolchain/smoke only)"
        type: boolean
        default: false
      only_arch:
        description: "Build just one arch (so x64 doesn't compete with arm64 for scarce macOS runners / isn't needlessly rebuilt)"
        type: choice
        options: [both, x64, arm64]
        default: both

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.tag }} ${{ matrix.edition }}
    # only_arch lets a fill/fix run target one architecture (default: both).
    if: ${{ github.event.inputs.only_arch == 'both' || github.event.inputs.only_arch == matrix.pyarch }}
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: macos-x64,   pyarch: x64,   edition: ai }
          - { tag: macos-x64,   pyarch: x64,   edition: standard }
          - { tag: macos-arm64, pyarch: arm64, edition: ai }
          - { tag: macos-arm64, pyarch: arm64, edition: standard }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Set up Python 3.12 (${{ matrix.pyarch }})
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.pyarch }}

      - name: Use a real x86_64 Python (macos-x64)
        # setup-python gives arm64 on the Apple-Silicon runner and Nuitka can't
        # cross-compile — fetch a genuine x86_64 CPython 3.12 (runs under Rosetta).
        if: matrix.tag == 'macos-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo astral-sh/python-build-standalone \
            --pattern 'cpython-3.12.*-x86_64-apple-darwin-install_only.tar.gz' \
            --dir pydl --clobber
          tar -xzf pydl/cpython-3.12.*-x86_64-apple-darwin-install_only.tar.gz   # -> ./python/
          ln -sf python3 python/bin/python
          echo "$PWD/python/bin" >> "$GITHUB_PATH"
          ./python/bin/python3 -c "import platform; print('build python arch:', platform.machine())"

      - name: Normalise requirements.txt to UTF-8
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("requirements.txt")
          p.write_text(p.read_text(encoding="utf-16"), encoding="utf-8")
          PY

      - name: Stage release build inputs
        if: ${{ !inputs.debug }}
        shell: bash
        env:
          REL: ${{ secrets.VTA_RELEASE_B64 }}
        run: |
          if [ -z "${REL:-}" ]; then echo "::error::Secret VTA_RELEASE_B64 is not set."; exit 1; fi
          python - <<'PY'
          import os, base64, gzip, pathlib
          pathlib.Path("_relbuild.py").write_bytes(gzip.decompress(base64.b64decode(os.environ["REL"])))
          PY
          echo "VTA_RELEASE_SCRIPT=_relbuild.py" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify native AT9 codec is committed
        shell: bash
        run: |
          LIB="native/${{ matrix.tag }}/libat9codec.dylib"
          [ -f "$LIB" ] || { echo "::error::$LIB missing. Run scripts/update_native_libs.py and commit."; exit 1; }

      - name: Build (${{ matrix.edition }})
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          VTA_NUITKA_PROGRESS: "1"
          VTA_SKIP_PIP: "1"
          VTA_NONINTERACTIVE: "1"
        run: |
          FLAG=""
          if [ "${{ matrix.edition }}" = "standard" ]; then FLAG="--no-icon-ai"; fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            python -u setup_build.py $FLAG          # non-release: visible output
          else
            # PUBLIC-REPO SAFETY: the release build generates secret key material — never
            # let its output reach the public log. Capture to a file we never surface.
            set +e
            python -u setup_build.py $FLAG > build_output.log 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::release build failed (exit $rc). Output withheld (may contain secrets)."
              rm -f build_output.log
              exit "$rc"
            fi
            rm -f build_output.log
            echo "release build succeeded (output withheld for public-log safety)."
          fi

      - name: Clean up staged inputs
        if: always()
        shell: bash
        run: rm -f _relbuild.py

      - name: Verify package is labelled for this arch
        shell: bash
        run: |
          PKG=$(ls dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.zip 2>/dev/null | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::expected dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.zip not found."
            ls -la dist || true
            exit 1
          fi
          echo "OK: $PKG"

      - name: Smoke launch (offscreen, non-gating)
        continue-on-error: true
        run: |
          APP=$(find dist -maxdepth 3 -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "no .app found"; exit 0; }
          EXENAME=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist" 2>/dev/null)
          EXE="$APP/Contents/MacOS/$EXENAME"
          [ -x "$EXE" ] && [ -f "$EXE" ] || { echo "bundle executable not found ($EXE)"; exit 0; }
          echo "launching: $EXENAME (offscreen, 25s)"
          QT_QPA_PLATFORM=offscreen "$EXE" >smoke.log 2>&1 &
          PID=$!; sleep 25
          if kill -0 "$PID" 2>/dev/null; then echo "smoke OK: still running after 25s"; kill "$PID" 2>/dev/null || true
          else wait "$PID"; RC=$?; echo "app exited early rc=$RC"; fi
          rm -f smoke.log

      - name: Build drag-to-Applications .dmg
        shell: bash
        run: |
          APP=$(find dist -maxdepth 3 -name "*.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::no .app to package into a .dmg"; exit 1; }
          staging=$(mktemp -d)
          cp -R "$APP" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "VitaTheme Architect" -srcfolder "$staging" -ov -format UDZO \
            "dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.dmg"
          echo "built dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.dmg"

      - name: Upload zip + dmg to the release
        if: ${{ !inputs.debug }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${TAG:-v2.0}"
          gh release upload "$TAG" \
            "dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.zip" \
            "dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.dmg" \
            --clobber --repo "$GITHUB_REPOSITORY"
