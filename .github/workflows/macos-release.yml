# macOS release build — the mac half of a release, on its own so you can (re)build
# just macOS (zip + drag-to-Applications .dmg) without re-running the Windows/Linux
# matrix. macOS is the one platform you can't build locally, so this is its home.
#
# Dispatch only (uses the release secret, so never a pull_request). Default is a REAL
# release build (online features): its output is captured and NEVER printed, because
# the release build generates secret key material and this is a public repo. Set
# `debug: true` for a non-release build with visible output (no secret, no upload) to
# debug the toolchain/smoke safely.
#
# Produces per arch × edition: vitaThemeArchitect-macos-<arch>-<edition>.{zip,dmg}.

name: macOS release (zip + dmg)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload to"
        default: "v3.0"
        required: true
      debug:
        description: "Non-release build, visible output, no upload (toolchain/smoke only)"
        type: boolean
        default: false
      only_arch:
        description: "Build just one arch (so x64 doesn't compete with arm64 for scarce macOS runners / isn't needlessly rebuilt)"
        type: choice
        options: [both, x64, arm64]
        default: both

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the matrix from only_arch, so a single-arch fill/fix run never even creates
  # the other arch's jobs (they can't then compete for scarce macOS runners). A
  # job-level `if` can't see `matrix`, hence this dynamic matrix.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        env:
          ONLY: ${{ github.event.inputs.only_arch }}
        run: |
          ONLY="${ONLY:-both}"
          python3 - "$ONLY" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          only = sys.argv[1]
          full = [
            {"tag": "macos-x64",   "arch": "x64",   "target": "x86_64-apple-darwin", "edition": "ai"},
            {"tag": "macos-x64",   "arch": "x64",   "target": "x86_64-apple-darwin", "edition": "standard"},
            {"tag": "macos-arm64", "arch": "arm64", "target": "",                    "edition": "ai"},
            {"tag": "macos-arm64", "arch": "arm64", "target": "",                    "edition": "standard"},
          ]
          inc = [m for m in full if only in ("both", m["arch"])]
          print("matrix=" + json.dumps({"include": inc}))
          PY

  build:
    name: ${{ matrix.tag }} ${{ matrix.edition }}
    needs: setup
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Only ~1 macOS runner is reliably available to this account at a time; two
      # concurrent jobs make the loser sit queued and hit the ~15-min queued-job
      # timeout (cancelled, no runner, no log). Run them strictly one at a time.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up the Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi
          rustc --version

      - name: Cache cargo
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a  # v4.1.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.tag }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.tag }}-

      - name: Stage the off-git release protection crate (from secret)
        if: ${{ !inputs.debug }}
        shell: bash
        env:
          REL: ${{ secrets.VTA_RELEASE_B64 }}
        run: |
          if [ -z "${REL:-}" ]; then echo "::error::Secret VTA_RELEASE_B64 is not set."; exit 1; fi
          # gzip+base64 of a tar of `native-release/` and `.dev/theme_api_url`.
          echo "$REL" | base64 -d | tar -xz
          test -f native-release/build_online_module.py || { echo "::error::release bundle missing the hook"; exit 1; }
          echo "VTA_RELEASE_SCRIPT=native-release/build_online_module.py" >> "$GITHUB_ENV"

      - name: Build + package (${{ matrix.edition }})
        shell: bash
        env:
          VTA_TAG_OVERRIDE: ${{ matrix.tag }}
          VTA_BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            cargo run -p xtask --release -- package --edition ${{ matrix.edition }}   # non-release: visible output
          else
            # PUBLIC-REPO SAFETY: the release step runs the protection hook (its build.rs
            # reads the API key). Keep the whole build's output out of the public log.
            set +e
            cargo run -p xtask --release -- package --edition ${{ matrix.edition }} > build_output.log 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::release build failed (exit $rc). Output withheld (may contain secrets)."
              rm -f build_output.log
              exit "$rc"
            fi
            rm -f build_output.log
            echo "release build succeeded (output withheld for public-log safety)."
          fi

      - name: Clean up the staged release crate
        if: always()
        shell: bash
        run: rm -rf native-release .dev

      - name: Verify package is labelled for this arch
        shell: bash
        run: |
          PKG=$(ls dist/v3/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.zip 2>/dev/null | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::expected dist/v3/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.zip not found."
            ls -la dist/v3 || true
            exit 1
          fi
          echo "OK: $PKG"

      - name: Smoke launch (non-gating)
        continue-on-error: true
        run: |
          APP=$(find dist/v3 -maxdepth 3 -name "*.app" -type d | head -1)
          [ -z "$APP" ] && { echo "no .app found"; exit 0; }
          EXENAME=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist" 2>/dev/null)
          EXE="$APP/Contents/MacOS/$EXENAME"
          [ -x "$EXE" ] && [ -f "$EXE" ] || { echo "bundle executable not found ($EXE)"; exit 0; }
          echo "launching: $EXENAME (25s)"
          "$EXE" >smoke.log 2>&1 &
          PID=$!; sleep 25
          if kill -0 "$PID" 2>/dev/null; then echo "smoke OK: still running after 25s"; kill "$PID" 2>/dev/null || true
          else wait "$PID"; RC=$?; echo "app exited early rc=$RC (output withheld)"; fi
          rm -f smoke.log

      - name: Build drag-to-Applications .dmg
        shell: bash
        run: |
          APP=$(find dist/v3 -maxdepth 3 -name "*.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::no .app to package into a .dmg"; exit 1; }
          staging=$(mktemp -d)
          cp -R "$APP" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "VitaTheme Architect" -srcfolder "$staging" -ov -format UDZO \
            "dist/v3/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.dmg"
          echo "built dist/v3/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.dmg"

      - name: Upload zip + dmg to the release
        if: ${{ !inputs.debug }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${TAG:-v3.0}"
          gh release upload "$TAG" \
            "dist/v3/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.zip" \
            "dist/v3/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.dmg" \
            --clobber --repo "$GITHUB_REPOSITORY"
