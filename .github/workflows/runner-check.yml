# Throwaway diagnostic: confirms which GitHub-hosted runners this repo can actually
# get. Trivial jobs (no build) so they finish in seconds IF a runner is assigned.
# Safe to delete once the macOS runner situation is understood.
name: runner-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Report
        run: |
          echo "runner OK: ${{ matrix.os }}"
          uname -a
