# Windows + Linux release builds (x64 + arm64, both editions), to complement the
# macOS workflow. The repo is public, so Actions are free.
#
# Manual trigger only (workflow_dispatch): the build uses the release secret, so it
# must never run from an untrusted pull_request. Third-party actions are pinned by SHA.
#
# Build jobs are continue-on-error: a flaky/unavailable runner (GitHub's ARM images,
# capacity) is SKIPPED rather than failing the run — build any skipped platform
# locally (build-all.ps1). Each job uploads its own package straight to the release,
# so one platform skipping never blocks the others.
#
# Output per job: vitaThemeArchitect-<os>-<arch>-<edition>.{zip|tar.gz}
#
# Requires the release build script as the encrypted Actions secret VTA_RELEASE_B64
# (gzip + base64), same as the macOS workflow. The native at9codec libs must already
# be committed under native/<os>-<arch>/ (scripts/update_native_libs.py).

name: Desktop build (Windows + Linux)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the builds to (e.g. v1.0)"
        default: "v1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.tag }} ${{ matrix.edition }}
    runs-on: ${{ matrix.os }}
    # Non-blocking: a flaky/unavailable runner skips instead of failing the run.
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,    tag: windows-x64,   pyarch: x64,   edition: ai }
          - { os: windows-latest,    tag: windows-x64,   pyarch: x64,   edition: standard }
          - { os: windows-11-arm,    tag: windows-arm64, pyarch: arm64, edition: ai }
          - { os: windows-11-arm,    tag: windows-arm64, pyarch: arm64, edition: standard }
          - { os: ubuntu-latest,     tag: linux-x64,     pyarch: x64,   edition: ai }
          - { os: ubuntu-latest,     tag: linux-x64,     pyarch: x64,   edition: standard }
          - { os: ubuntu-24.04-arm,  tag: linux-arm64,   pyarch: arm64, edition: ai }
          - { os: ubuntu-24.04-arm,  tag: linux-arm64,   pyarch: arm64, edition: standard }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12 (${{ matrix.pyarch }})
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.pyarch }}

      - name: Linux build + runtime dependencies
        if: runner.os == 'Linux'
        # Toolchain for Nuitka + the Qt/VLC runtime libs the app bundles/links. CI has
        # passwordless sudo, which setup_build uses for VLC (VTA_NONINTERACTIVE below).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential patchelf ccache python3-dev \
            libvlc-dev vlc-plugin-base ffmpeg libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-randr0 libxcb-shape0 libxcb-xkb1 libxcb-util1

      - name: Normalise requirements.txt to UTF-8
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("requirements.txt")
          p.write_text(p.read_text(encoding="utf-16"), encoding="utf-8")
          print("requirements.txt converted to UTF-8")
          PY

      - name: Prepare release build inputs
        shell: bash
        env:
          REL: ${{ secrets.VTA_RELEASE_B64 }}
        run: |
          if [ -z "${REL:-}" ]; then
            echo "::error::Secret VTA_RELEASE_B64 is not set; cannot produce a release build."
            exit 1
          fi
          python - <<'PY'
          import os, base64, gzip, pathlib
          data = gzip.decompress(base64.b64decode(os.environ["REL"]))
          pathlib.Path("_relbuild.py").write_bytes(data)
          print("release build script staged")
          PY
          echo "VTA_RELEASE_SCRIPT=_relbuild.py" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify native AT9 codec is committed
        shell: bash
        run: |
          case "${{ matrix.tag }}" in
            windows-*) LIB="native/${{ matrix.tag }}/at9codec.dll" ;;
            linux-*)   LIB="native/${{ matrix.tag }}/libat9codec.so" ;;
          esac
          if [ ! -f "$LIB" ]; then
            echo "::error::$LIB is missing. Run 'python scripts/update_native_libs.py' and commit native/ first."
            exit 1
          fi
          echo "found $LIB"

      - name: Build (${{ matrix.edition }})
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          VTA_NUITKA_PROGRESS: "1"
          VTA_SKIP_PIP: "1"            # deps installed above
          VTA_NONINTERACTIVE: "1"      # no tty: skip the sudo credential prompt
        run: |
          FLAG=""
          if [ "${{ matrix.edition }}" = "standard" ]; then FLAG="--no-icon-ai"; fi
          python -u setup_build.py $FLAG

      - name: Clean up staged inputs
        if: always()
        shell: bash
        run: rm -f _relbuild.py

      - name: Verify package
        id: pkg
        shell: bash
        run: |
          EXT="zip"; [ "${{ runner.os }}" = "Linux" ] && EXT="tar.gz"
          PKG=$(ls dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.$EXT 2>/dev/null | head -1)
          if [ -z "$PKG" ] || [ ! -s "$PKG" ]; then
            echo "::error::Expected package not found for ${{ matrix.tag }} ${{ matrix.edition }}."
            ls -la dist || true
            exit 1
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "Packaged: $PKG"

      - name: Upload to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
          PKG: ${{ steps.pkg.outputs.pkg }}
        run: |
          TAG="${TAG:-v1.0}"
          echo "Uploading $PKG to release $TAG"
          gh release upload "$TAG" "$PKG" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload artifact (backup copy)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}
          path: dist/vitaThemeArchitect-${{ matrix.tag }}-${{ matrix.edition }}.*
          if-no-files-found: error
          retention-days: 14
